name: Build & Release

on:
  push:
    tags:
      - "v*"
  # Permite ejecutar manualmente desde la UI de GitHub
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
          # ── macOS ─────────────────────────────────────────────────────
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          # ── Linux ─────────────────────────────────────────────────────
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust ────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ── Node.js + pnpm ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies
        run: cd ui && pnpm install

      # ── Dependencias del sistema (Linux) ────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Linux cross-compile tools (arm64)
        if: matrix.platform == 'ubuntu-22.04' && matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # ── Build Tauri ──────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing (opcional — comentar si no se tiene el certificado)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PortView ${{ github.ref_name }}"
          releaseBody: |
            ## PortView ${{ github.ref_name }}

            Consulta el [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) para ver los cambios.

            ### Descarga para tu plataforma

            | SO | Arquitectura | Archivo |
            |---|---|---|
            | Windows | x64 | `portview_*_x64-setup.exe` |
            | Windows | arm64 | `portview_*_arm64-setup.exe` |
            | macOS | Intel | `portview_*_x64.dmg` |
            | macOS | Apple Silicon | `portview_*_aarch64.dmg` |
            | Linux | x64 | `portview_*_amd64.AppImage` / `.deb` |
            | Linux | arm64 | `portview_*_arm64.AppImage` / `.deb` |
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          projectPath: "."
          tauriScript: cargo tauri

  # ── Tests del core Rust ─────────────────────────────────────────────
  test-core:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          RUST_LOG: debug
