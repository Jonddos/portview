[package]
name = "portview"
version = "0.2.0"
description = "Visor gráfico multiplataforma de puertos de red"
authors = ["PortView Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "portview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "portview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }

# netstat2 no compila en Linux (bug con libc moderno); en Linux usamos ss nativo
[target.'cfg(not(target_os = "linux"))'.dependencies]
netstat2 = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
